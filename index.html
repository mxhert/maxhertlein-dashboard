<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>maxhertlein.com</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css">
</head><body><div class="shell">
<header><a class="brand" href="/"><span class="mark">m.</span> maxhertlein.com</a><div class="head-actions"><button id="theme" class="icon-btn" aria-label="Toggle theme">◐</button></div></header>
<main>
<section class="section"><div class="section-head"><div></div><div class="actions"><button id="edit" class="plain-btn">Edit links</button><button id="add" class="add-btn">＋ Add link</button></div></div><nav id="categories" class="categories" aria-label="Bookmark categories"></nav><div id="grid" class="bookmark-grid"></div><div id="empty" class="empty hidden">No links</div></section>
<section class="section"><a class="app-card" href="/workouts/"><div class="app-symbol">↗</div><div class="app-copy"><div class="app-title">Workout tracker</div></div><span class="arrow">↗</span></a></section>
</main></div>
<dialog id="editor"><form id="bookmark-form"><div class="dialog-head"><h2 id="dialog-title">Add link</h2><button type="button" id="close" class="icon-btn">×</button></div><label for="name">Name</label><input id="name" maxlength="100" required><label for="url">URL</label><input id="url" type="url" required><label for="category">Category</label><select id="category"><option>Daily</option><option>Work</option><option>Personal</option><option>Shopping</option><option>Other</option></select><div class="dialog-actions"><button type="button" id="cancel" class="plain-btn">Cancel</button><button class="add-btn" type="submit">Save</button></div></form></dialog>
<div id="toast" class="toast" role="status"></div><script src="/app.js" defer></script></body></html>

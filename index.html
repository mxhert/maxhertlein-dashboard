<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>maxhertlein.com</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css?v=20261113e">
</head>
<body>
<div class="shell">
  <header>
    <a class="brand" href="/"><span class="mark">m.</span> maxhertlein.com</a>
    <div class="head-actions"><button id="theme" class="icon-btn" aria-label="Toggle theme">◐</button></div>
  </header>
  <main>
    <section class="section">
      <form id="google-search" class="google-search" role="search">
        <span aria-hidden="true" class="search-symbol">⌕</span>
        <input id="search-query" type="search" placeholder="Search Google" aria-label="Search Google" autocomplete="off">
      </form>
      <div class="section-head bookmark-toolbar">
        <div class="view-switch" role="group" aria-label="Bookmark device">
          <button id="mobile-view" class="view-tab" type="button">Mobile</button>
          <button id="desktop-view" class="view-tab" type="button">Desktop</button>
        </div>
        <button id="edit" class="plain-btn" type="button">Edit links</button>
      </div>
      <div id="grid" class="bookmark-grid"></div>
      <div id="empty" class="empty hidden">No bookmarks yet</div>
    </section>
    <section class="section">
      <a class="app-card" href="/workouts/">
        <div class="app-symbol">↗</div>
        <div class="app-copy"><div class="app-title">Workout tracker</div></div>
        <span class="arrow">↗</span>
      </a>
    </section>
  </main>
  <footer class="build-footer"><span id="build-version">Loading version…</span></footer>
</div>
<dialog id="pin-dialog">
  <form id="pin-auth-form">
    <div class="dialog-head"><h2 id="pin-dialog-title">Unlock</h2><button type="button" id="pin-close" class="icon-btn">×</button></div>
    <label for="pin-input">PIN</label>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" required>
    <p id="pin-error" class="error-text"></p>
    <div class="dialog-actions"><button type="button" id="pin-cancel" class="plain-btn">Cancel</button><button id="pin-submit" class="add-btn" type="submit">Unlock</button></div>
  </form>
</dialog>
<dialog id="editor">
  <form id="bookmark-form">
    <div class="dialog-head"><h2 id="dialog-title">Add link</h2><button type="button" id="close" class="icon-btn">×</button></div>
    <label for="name">Name</label><input id="name" maxlength="100" required>
    <label for="url">URL</label><input id="url" type="url" required>
    <label for="category">Device</label>
    <select id="category"><option>Mobile</option><option>Desktop</option></select>
    <div class="dialog-actions"><button type="button" id="cancel" class="plain-btn">Cancel</button><button class="add-btn" type="submit">Save</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status"></div>
<script src="/app.js?v=20261113e" defer></script>
</body>
</html>
